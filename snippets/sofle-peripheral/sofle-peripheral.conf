# 右手 = peripheral（外设半边）
#
# 由 build.yaml 里每个右手变体的 `snippets:` 引入（`-S sofle-peripheral`）。
#
# ⚠️ 不要在这里写 ZMK_STUDIO / ZMK_STUDIO_RPC / 任何 *_STUDIO_RPC：
#    Studio 的 protobuf 桩代码只在 central 生成，右手开这些会因缺少
#    proto/zmk/custom.pb.h 而编译失败。
#    也不要放在两半共用的 config/sofle.conf 里 —— 那会同时作用于左手以外的所有构建。

#
# 设备设置：接收并应用 central 中继过来的设置变更
# https://github.com/cormoran/zmk-module-settings-rpc
#
CONFIG_ZMK_SETTINGS_RPC=y

#
# 自定义设置：中继接收端
# https://github.com/cormoran/zmk-feature-custom-settings
#
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# 说明：其余配置（键盘名、蓝牙功率、电池上报、sleep、EC11 编码器、
# ZMK_SPLIT_RELAY_EVENT、线程栈等）两半共用，放在 config/sofle.conf。
# central 专属的 Studio / OS 识别 / 默认层 / 各扩展模块，
# 全部在 snippets/sofle-central/sofle-central.conf。