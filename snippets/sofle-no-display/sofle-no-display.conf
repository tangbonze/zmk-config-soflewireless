# 禁用 Sofle 板载 OLED（SSD1306）
#
# 用途一：无屏版本 —— 不开启显示，SSD1306 驱动不编译进固件省 flash。
# 用途二：nice!view 版本 —— 板载 OLED 与 nice!view 二选一，
#         nice_view.overlay 会把 zephyr,display 指向 nice_view，
#         但 SSD1306 驱动仍会编译进去，这里显式关掉。
#
# sofle.dtsi 里 `zephyr,display = &oled` 是硬编码的，
# 不加这个 snippet 的话即使不开启显示，SSD1306 驱动仍会被编译进去。
CONFIG_SSD1306=n