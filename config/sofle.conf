# Sofle 通用配置（左手 / 右手、所有显示变体共用）
#
# ZMK 按 sofle_left / sofle_right 共同应用本文件（用户 config 优先级最高）。
# 这里只放**两半都需要**的配置；按半边区分的配置分别在：
#
#   snippets/sofle-central/     左手 = central：Studio / RPC / OS 识别 /
#                               默认层 / 各扩展模块
#   snippets/sofle-peripheral/  右手 = peripheral：接收 / 应用设置中继
#
# ⚠️ 不要在这里设置 CONFIG_ZMK_SPLIT_ROLE_CENTRAL：它会对两半同时生效，
#   导致右手也变 central、分体失效。分体角色在 Kconfig.defconfig 里设。
#
# ⚠️ 不要在这里设置 ZMK_STUDIO 或任何 *_STUDIO_RPC：外设半边没有
#   ZMK_STUDIO_RPC（protobuf 不生成），强开会因缺 custom.pb.h 编译失败。
#
# 显示（OLED / nice!view）由 build.yaml 的 snippet 选择，此处不开启
# CONFIG_ZMK_DISPLAY —— 无屏与 nice!view 变体都需要它保持关闭。

# 蓝牙设备名（<=16 字节；写在用户 conf 里可确定性地覆盖 defconfig 默认值）
CONFIG_ZMK_KEYBOARD_NAME="Sofle DYA"

# 蓝牙发射功率 +8dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#
# 电池
#
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
# 分体电量代理是 central 专属（ZMK_SPLIT_BLE_CENTRAL_*），已移到
# snippets/sofle-central/sofle-central.conf；写在这里会让外设半边出现
# "assigned ... but got ''" 的 Kconfig 警告。

#
# 蓝牙配置档数量
#
# 可用配置档 +1（+1 留给 peripheral；右手侧仅多占少量 RAM，无功能影响）
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

#
# 编码器（EC11）
#
# Sofle 每半各有一枚 EC11 旋转编码器，overlay 里已 status = "okay"，
# keymap 用 sensor-bindings 的 &inc_dec_kp 接管。这两行必须保留 ——
# 删掉后 kscan 传感器仍在但不再产生事件，编码器会完全失效。
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#
# 电源管理（DYA Studio 可在网页上实时调整，经 settings RPC 下发）
#
CONFIG_ZMK_SLEEP=y
# 30s
CONFIG_ZMK_IDLE_TIMEOUT=30000
# 30min
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

#
# cormoran/zmk fork 提供的设置项
#
# 半双工 UART（有线连接分体）
# ⚠️ ZMK_SPLIT_WIRED_UART_MODE_* 是一个 choice，只在 ZMK_SPLIT_WIRED 启用
#    （即使用 wired split snippet/配置）时才存在。此处写死会在未启用有线分体时
#    产生 "choice symbol ... was selected but no symbol ended up as the choice
#    selection" 警告，因此保持注释；将来真有线连接时再取消注释。
# CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
# 分体间事件中继：设置变更从主控同步到外设半边
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# Zephyr 4.x 默认开启 CONSOLE，此处关闭以省 flash
# 排查问题时用 `west zmk-build -a sofle_left -S zmk-usb-logging --flash`
# 临时编一个带日志的固件（会额外占用 flash，日常固件不受影响）。
CONFIG_CONSOLE=n

#
# 资源与协议调整（两半共用；central 专属的 RPC 缓冲/栈在 sofle-central.conf）
#

# 缩短设置落盘防抖，减少编辑设置后丢数据的风险
# 注意：会增加 flash 写入频率
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# 线程栈（central 专属的 split 运行栈与 Studio RPC 缓冲/栈在 sofle-central.conf）
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256